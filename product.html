<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Handcrafted Namji doll from the Adamawa Region, Cameroon — Roots Gallery.">
  <title>Product — Roots Gallery</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪆</text></svg>">
</head>
<body data-page="shop">
  <main>
    <div id="product-detail-root">
      <div class="container container--wide">

        <!-- Breadcrumbs -->
        <nav class="breadcrumbs" aria-label="Breadcrumb">
          <a href="index.html">Home</a>
          <span class="sep" aria-hidden="true">›</span>
          <a href="shop.html">Collection</a>
          <span class="sep" aria-hidden="true">›</span>
          <span class="current" id="breadcrumb-product" aria-current="page">Loading…</span>
        </nav>

        <!-- Product Detail -->
        <div class="product-detail">
          <div class="product-detail-grid">

            <!-- ─── IMAGE GALLERY ─── -->
            <div class="product-gallery" aria-label="Product images">
              <div class="gallery-thumbs" id="gallery-thumbs" role="list" aria-label="Image thumbnails">
                <!-- Populated by product.js -->
              </div>
              <div class="gallery-main" role="img">
                <img
                  id="gallery-main-image"
                  src=""
                  alt=""
                  width="600" height="800"
                  style="width:100%;height:100%;object-fit:cover;"
                >
                <button class="gallery-zoom-btn" aria-label="Zoom image">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
                </button>
              </div>
            </div>

            <!-- ─── PRODUCT INFO ─── -->
            <div class="product-info">

              <div class="product-info-category" id="product-category"></div>
              <h1 id="product-title"></h1>

              <div class="product-info-price">
                <span class="price" id="product-price"></span>
              </div>

              <div id="product-availability" style="margin-bottom:var(--s5);"></div>

              <p class="product-info-description" id="product-description"></p>

              <!-- Add to cart -->
              <div class="product-actions">
                <div class="product-qty" aria-label="Quantity">
                  <button class="product-qty-btn" id="qty-dec" aria-label="Decrease quantity">−</button>
                  <input
                    type="number"
                    id="product-qty"
                    class="product-qty-input"
                    value="1"
                    min="1"
                    max="99"
                    aria-label="Quantity"
                  >
                  <button class="product-qty-btn" id="qty-inc" aria-label="Increase quantity">+</button>
                </div>
                <button
                  class="btn btn-primary btn-lg btn-full"
                  id="add-to-cart-btn"
                  data-add-to-cart=""
                  style="max-width:400px;"
                >
                  Add to Cart
                </button>
              </div>

              <!-- Product Details accordion -->
              <div class="product-details-accordion">

                <div class="accordion-item open">
                  <button class="accordion-header" aria-expanded="true">
                    <span class="accordion-title">Product Details</span>
                    <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="6 9 12 15 18 9"/></svg>
                  </button>
                  <div class="accordion-body">
                    <div class="accordion-content">
                      <div class="detail-table" id="product-details-table">
                        <!-- Populated by product.js -->
                      </div>
                    </div>
                  </div>
                </div>

              </div>
              <!-- ─── END ACCORDION ─── -->

            </div>
            <!-- ─── END PRODUCT INFO ─── -->

          </div>
        </div>

        <!-- ═══════════════════════════════════════════════
             RELATED PRODUCTS
        ═══════════════════════════════════════════════ -->
        <section class="related-products" id="related-products-section" aria-labelledby="related-heading">
          <div class="section-header">
            <div class="section-header-left">
              <p class="subheading">You May Also Like</p>
              <h2 id="related-heading">More from This Category</h2>
            </div>
            <a href="shop.html" class="text-link">
              View all pieces
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </a>
          </div>
          <div class="products-grid products-grid--3col" id="related-products-grid" role="list">
            <!-- Populated by product.js -->
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- ═══════════════════════════════════════════════
       NEWSLETTER
  ═══════════════════════════════════════════════ -->
  <section class="newsletter">
    <div class="container container--narrow">
      <p class="subheading">Stay in Touch</p>
      <h2>Collector Notes &amp; New Arrivals</h2>
      <p>Subscribe for thoughtful updates on new pieces, cultural insights, and collector's notes.</p>
      <form class="newsletter-form" novalidate>
        <input type="email" placeholder="Your email address" aria-label="Email address" required>
        <button type="submit">Subscribe</button>
      </form>
    </div>
  </section>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
