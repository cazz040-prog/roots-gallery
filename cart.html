<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your shopping cart at Roots Gallery.">
  <title>Your Cart — Roots Gallery</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪆</text></svg>">
</head>
<body data-page="cart">
  <main>

    <!-- ═══════════════════════════════════════════════
         PAGE HERO
    ═══════════════════════════════════════════════ -->
    <section class="page-hero">
      <div class="container container--narrow" style="text-align:center;">
        <p class="subheading" style="margin-bottom:var(--s4)">Your Selection</p>
        <h1 class="heading-1">Shopping Cart</h1>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════
         CART LAYOUT
    ═══════════════════════════════════════════════ -->
    <div class="container container--wide">
      <div class="cart-layout">

        <!-- ─── CART ITEMS ─── -->
        <div>
          <div id="cart-items-container">
            <!-- Populated by cart.js -->
            <div style="padding:var(--s16) 0;text-align:center;">
              <p style="color:var(--text-3);">Loading cart…</p>
            </div>
          </div>

          <!-- Continue shopping -->
          <div style="padding-top:var(--s8);">
            <a href="shop.html" class="text-link">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:14px;height:14px;transform:rotate(180deg);"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
              Continue shopping
            </a>
          </div>
        </div>

        <!-- ─── CART SUMMARY ─── -->
        <div>
          <div class="cart-summary" id="cart-summary-container">
            <!-- Populated by cart.js -->
          </div>

          <!-- Trust signals -->
          <div style="margin-top:var(--s6);padding:var(--s6);background:var(--warm-white);border:1px solid var(--border-light);">
            <div style="display:flex;flex-direction:column;gap:var(--s4);">
              <div style="display:flex;align-items:center;gap:var(--s3);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:18px;height:18px;color:var(--sage);flex-shrink:0;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span style="font-size:var(--fs-sm);color:var(--text-2);">All orders insured during transit</span>
              </div>
              <div style="display:flex;align-items:center;gap:var(--s3);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:18px;height:18px;color:var(--sage);flex-shrink:0;"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                <span style="font-size:var(--fs-sm);color:var(--text-2);">Free shipping on orders over $500</span>
              </div>
              <div style="display:flex;align-items:center;gap:var(--s3);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:18px;height:18px;color:var(--sage);flex-shrink:0;"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                <span style="font-size:var(--fs-sm);color:var(--text-2);">Returns accepted within 14 days</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ═══════════════════════════════════════════════
         YOU MAY ALSO LIKE
    ═══════════════════════════════════════════════ -->
    <section class="section section-warm" aria-labelledby="cart-related-heading">
      <div class="container container--wide">
        <div class="section-header">
          <div class="section-header-left">
            <p class="subheading">Continue Exploring</p>
            <h2 id="cart-related-heading">You May Also Like</h2>
          </div>
          <a href="shop.html" class="text-link">
            View all
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
        </div>
        <!-- Small product grid for upsell -->
        <div class="products-grid" id="cart-related-grid" role="list">
          <!-- Populated inline below -->
        </div>
      </div>
    </section>

  </main>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script>
    // Populate related grid with a few featured items
    document.addEventListener('DOMContentLoaded', function () {
      const grid = document.getElementById('cart-related-grid');
      if (!grid || typeof PRODUCTS === 'undefined') return;
      const items = PRODUCTS.filter(p => p.isFeatured).slice(0, 4);
      grid.innerHTML = items.map(p => `
        <article class="product-card">
          <a href="product.html?slug=${p.slug}" class="product-card-image">
            <img src="${p.thumbnail}" alt="${p.name}" loading="lazy" width="600" height="800">
            ${p.isNew ? `<div class="product-card-badges"><span class="badge badge--new">New</span></div>` : ''}
          </a>
          <div class="product-card-info">
            <div class="product-card-category">${p.categoryLabel}</div>
            <h3 class="product-card-name"><a href="product.html?slug=${p.slug}">${p.name}</a></h3>
            <div class="product-card-material">${p.materials.split(',')[0]}</div>
            <div class="product-card-footer">
              <span class="product-price">$${p.price}</span>
              <a href="product.html?slug=${p.slug}" class="product-card-quick-add">View</a>
            </div>
          </div>
        </article>
      `).join('');
    });
  </script>
</body>
</html>
